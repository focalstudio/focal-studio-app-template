name: Release Review Gate

on:
  push:
    branches:
      - "release/**"
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  pull-requests: write
  contents: read
  actions: read

jobs:
  gate:
    name: Release Quality Gate
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'release/') || github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --passWithNoTests=false

      - name: Check version is bumped
        id: version_check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          if [ "$PKG_VERSION" != "$APP_VERSION" ]; then
            echo "❌ Version mismatch: package.json=$PKG_VERSION, app.json=$APP_VERSION"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Version $PKG_VERSION is consistent."

      - name: Check CHANGELOG has release entry
        run: |
          VERSION="${{ steps.version_check.outputs.version }}"
          if ! grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "❌ CHANGELOG.md does not have an entry for version $VERSION."
            echo "Move '## [Unreleased]' to '## [$VERSION] — $(date +%Y-%m-%d)' before releasing."
            exit 1
          fi
          echo "✅ CHANGELOG.md has entry for $VERSION."

      - name: Post summary comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version_check.outputs.version }}';
            const sha = context.payload.pull_request.head.sha;

            // Looks up the latest run of a sibling workflow for this exact commit, rather than
            // asserting green — a workflow that never ran for this SHA (path filter didn't
            // match, or it only fires on workflow_dispatch/release) must show as not run, not
            // as passed.
            async function latestConclusion(workflowFile) {
              try {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflowFile,
                  head_sha: sha,
                  per_page: 1,
                });
                const run = data.workflow_runs[0];
                if (!run) return null;
                if (run.status !== 'completed') return 'pending';
                return run.conclusion;
              } catch (error) {
                core.warning(`Could not look up ${workflowFile} runs: ${error.message}`);
                return null;
              }
            }

            function renderRow(label, conclusion, notRunLabel) {
              if (conclusion === 'success') return `| ${label} | ✅ Passed |`;
              if (conclusion === 'pending') return `| ${label} | ⏳ Running |`;
              if (conclusion === null) return `| ${label} | ⚠️ ${notRunLabel} |`;
              return `| ${label} | ❌ Failed |`;
            }

            const bootstrapConclusion = await latestConclusion('template-smoke-test.yml');
            const backendConclusion = await latestConclusion('template-backend-smoke-test.yml');
            const maestroConclusion = await latestConclusion('maestro-e2e.yml');

            const body = [
              '## Release Review Gate',
              '',
              `**Version:** v${version}`,
              '',
              '| Check | Status |',
              '|---|---|',
              '| Type-check | ✅ Passed |',
              '| Lint | ✅ Passed |',
              '| Tests | ✅ Passed |',
              '| Screen tests | ✅ Passed |',
              '| Version consistency | ✅ Passed |',
              '| CHANGELOG entry | ✅ Passed |',
              renderRow('Bootstrap smoke test', bootstrapConclusion, 'Not run for this change'),
              renderRow('Backend-wiring smoke test', backendConclusion, 'Not run for this change'),
              renderRow('Device E2E (Maestro)', maestroConclusion, 'Not run for this release'),
              '',
              'This release is ready to merge to `main`.',
              '',
              '**Before merging**, confirm:',
              '- [ ] Tested on iOS device or TestFlight build',
              '- [ ] Tested on Android device or Play internal-track build',
              '- [ ] Dev mode is **off** (tap title 5× — no dev badge appears)',
              '- [ ] App Store Connect build uploaded',
              '- [ ] Play Console internal-track build uploaded',
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
