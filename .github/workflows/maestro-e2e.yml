name: Maestro E2E

# Deliberately not on every push/PR: an iOS Simulator build needs macos-latest and
# `expo run:ios`'s full prebuild + native compile takes ~15-25 minutes per run. See #80.
#
# The reason is NOT cost on this repo, despite what this comment used to claim. macOS
# runners carry a 10x minute multiplier, but that applies to *billable* minutes, and
# focalstudio/focal-studio-app-template is public — GitHub-hosted runners are free for
# public repos. The two reasons that do hold (#113):
#
#   1. Wall-clock latency — ~15-25 min plus macOS runner queueing on every PR.
#   2. Downstream apps, which is the real one. A generated app inherits this workflow
#      and may well be private, where the 10x does bite. A `paths:` filter on src/**
#      matches essentially every feature PR, so "path filtered" would mean "always"
#      for them.
#
# Note also that on this repo the job hits the [APP_SLUG] bootstrap gate below and
# skips — the pre-merge signal here is a template-correctness check, and only earns
# its keep once an app has been bootstrapped from it.
on:
  pull_request:
    # PRs to main are release PRs — that is where a pre-merge E2E gate earns its
    # runner. `dev` is listed so the `e2e` opt-in label below can work at all: a
    # workflow that does not trigger cannot be opted into, so gating on the label
    # alone (with `branches: [main]`) would leave the opt-in permanently dead.
    branches: [main, dev]
    # `labeled` is load-bearing. The default types are opened/synchronize/reopened,
    # so adding `e2e` to an already-open PR would otherwise not re-trigger anything
    # and the label would appear broken. Non-`e2e` labels still fire the event, but
    # the job-level `if:` below skips them without allocating a runner.
    types: [opened, synchronize, reopened, labeled]
  # Weekly backstop for `dev` (#128). The static guard in
  # src/__tests__/e2e-contract.test.ts runs on every PR and catches a *removed*
  # seam in seconds. What it cannot catch is a `testID` that is still in the
  # source while the element carrying it is no longer rendered or reachable — a
  # screen dropped from the navigator, a row moved behind a new gate. Only a real
  # run finds that, and until now nothing ran one against `dev`, so flow rot on
  # the integration branch stayed invisible until release time.
  #
  # Three things about `schedule:` that are easy to get wrong:
  #   1. It only ever runs the workflow file from the DEFAULT branch (`main`
  #      here). Editing this block on `dev` changes nothing until it reaches
  #      main — and the run then executes main's steps against dev's code.
  #   2. It checks out the default branch too, which is not what this is for.
  #      Hence the explicit `ref:` on the checkout step below.
  #   3. GitHub disables scheduled workflows after 60 days of repository
  #      inactivity. A dormant app gets no weekly signal, which is fine.
  #
  # Weekly, not nightly: a run is ~15-25 min of macOS, and a generated app may be
  # private, where the 10x minute multiplier does bite (#113). Monday morning so a
  # break is found at the start of a week, and deliberately off the hour — GitHub
  # queues scheduled runs and :00 is the most congested slot.
  schedule:
    - cron: "17 6 * * 1"
  # Invoked by release.yml as a reusable workflow, in the same run, right after it
  # creates the vX.Y.Z tag.
  #
  # Deliberately NOT `release: [published]`. release.yml publishes that Release using
  # the default GITHUB_TOKEN, and GitHub never fires workflows from events created by
  # that token (its recursion guard), so the release trigger was dead code — it
  # silently never ran. Same trap android-release.yml hit with `push: tags:`. See #95.
  workflow_call: {}
  # Manual rerun path (e.g. re-running the flow after a simulator-specific fix).
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Pinned, not "latest" — the installer has no checksum/signature step, so an
  # unpinned version lets a compromised or unexpectedly-changed
  # get.maestro.mobile.dev response silently alter what CI executes between
  # runs. Keep this in sync with the "Maestro CLI" row in VERSIONS.md.
  MAESTRO_VERSION: '2.8.0'

# One run per ref per event. The case that saves real macOS minutes is a new commit
# on an `e2e`-labelled PR superseding a run already 20 minutes in.
#
# `github.event_name` is in the group key so the weekly run and the release-time
# `workflow_call` can never cancel each other or be cancelled by a PR — inside a
# called workflow that context holds the CALLER's event (`push`, from release.yml),
# which is what keeps the release run in its own group. Do NOT simplify this to the
# usual `${{ github.workflow }}-${{ github.ref }}`: that would let a PR run cancel
# the post-release run.
concurrency:
  group: maestro-e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: Maestro E2E (iOS Simulator)
    # A false job-level `if:` skips the job without allocating a runner, so routine
    # `dev` PRs cost nothing. The non-`pull_request` clause is what keeps the
    # workflow_call path from release.yml and manual workflow_dispatch reruns
    # working — for those events `github.event.pull_request` is null and both of
    # the other clauses would evaluate false. The weekly `schedule` run added in
    # #128 is admitted by that same first clause, so it needs no clause of its own.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.base.ref == 'main'
      || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # A scheduled run is triggered from — and would otherwise check out —
          # the default branch, `main`. The point of that run is `dev`, so name
          # it. Every other event wants the ref that triggered it, and `''` is
          # exactly actions/checkout's default for that, so this expression is a
          # no-op outside the cron.
          #
          # `dev` exists in every generated app: scripts/init.sh creates and
          # pushes both branches at bootstrap. If you have deleted `dev`, delete
          # the `schedule:` trigger above rather than editing this line.
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}

      # First, before any toolchain setup: the gate needs only the checkout, and
      # every step below already carries the same `if:`. On this template repo the
      # gate always trips, so running it after `npm ci` meant paying ~3 minutes of
      # macOS runner to decide there was nothing to do — 52 times a year more,
      # now that the weekly cron exists.
      - name: Check if app is bootstrapped
        id: bootstrap_check
        run: |
          # Echoed so the first real cron run self-verifies: `event=schedule` with
          # `ref=refs/heads/main` and a `head` matching origin/dev is proof the
          # workflow came from the default branch while the code came from dev.
          echo "event=${{ github.event_name }} ref=${{ github.ref }} head=$(git rev-parse --short HEAD)"
          if grep -q '\[APP_SLUG\]' app.json; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Template placeholders still present — skipping Maestro E2E run."
            echo "Run scripts/init.sh to bootstrap a real app before this workflow can run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.bootstrap_check.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.bootstrap_check.outputs.skip == 'false'
        run: npm ci --legacy-peer-deps

      # Maestro CLI requires Java 17+; macos-latest doesn't guarantee one is
      # present, so pin it explicitly rather than relying on the runner image.
      - name: Setup Java
        if: steps.bootstrap_check.outputs.skip == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Maestro CLI (pinned)
        if: steps.bootstrap_check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          # -f so an HTTP error page is never piped into bash, and pipefail so a
          # failed download fails this step rather than surfacing later as a
          # confusing "maestro: command not found".
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          # $GITHUB_PATH only applies to later steps, so extend PATH here too.
          export PATH="$HOME/.maestro/bin:$PATH"
          # The installer reads MAESTRO_VERSION from the environment. Assert it
          # honoured it, so a silently-"latest" install can't pass as pinned.
          installed="$(maestro --version 2>&1 || true)"
          if [[ "$installed" != *"$MAESTRO_VERSION"* ]]; then
            echo "::error::Expected Maestro $MAESTRO_VERSION, got: $installed"
            exit 1
          fi

      - name: Resolve app identifiers
        if: steps.bootstrap_check.outputs.skip == 'false'
        id: app_ids
        run: |
          node -e "
            const app = require('./app.json').expo;
            console.log('app_id=' + app.ios.bundleIdentifier);
            console.log('app_scheme=' + app.scheme);
          " >> "$GITHUB_OUTPUT"

      # `expo run:ios` serves the JS bundle only for as long as it stays in the
      # foreground, and GitHub Actions sets CI=1 — under which it exits as soon
      # as the app is launched, taking Metro with it. A Debug build embeds no
      # bundle, so the app comes up on a red "No script URL provided" screen and
      # every assertion in the flow fails. Start Metro as its own background
      # process first so it outlives that step, and fail here rather than
      # halfway through the flow if it never becomes ready.
      - name: Start Metro bundler
        if: steps.bootstrap_check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          npx expo start --port 8081 > "$RUNNER_TEMP/metro.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8081/status 2>/dev/null | grep -q "packager-status:running"; then
              echo "Metro is ready."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Metro did not become ready within 120s"
          cat "$RUNNER_TEMP/metro.log" || true
          exit 1

      - name: Build and launch iOS app in Simulator
        if: steps.bootstrap_check.outputs.skip == 'false'
        run: npx expo run:ios

      # Runs the whole directory rather than naming one file, so a flow added
      # later is picked up without touching this workflow. Every flow starts by
      # clearing state, so they are order-independent; `APP_SCHEME` is consumed
      # only by full-journey.yaml and harmlessly unused by the others.
      - name: Run Maestro flows
        if: steps.bootstrap_check.outputs.skip == 'false'
        run: |
          maestro test .maestro/ \
            -e APP_ID="${{ steps.app_ids.outputs.app_id }}" \
            -e APP_SCHEME="${{ steps.app_ids.outputs.app_scheme }}"

      # Maestro's view hierarchies are the only practical way to diagnose a CI-only
      # failure — they are what identified four of the six flow defects fixed in #92.
      # Metro's log rides along in the same bundle because a cold-runner bundler
      # timeout is the other likely first-run failure mode. Copied out of $HOME
      # first: upload-artifact does not reliably expand `~` in `path:`.
      #
      # `maestro test` writes these to ~/.maestro/tests/<run> by default. Not using
      # `--debug-output`: that flag carries only maestro.log, while the screenshots
      # and hierarchies still land in the default directory.
      - name: Collect Maestro debug output
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/maestro-debug"
          cp -R "$HOME/.maestro/tests" "$RUNNER_TEMP/maestro-debug/tests" 2>/dev/null || true
          cp "$RUNNER_TEMP/metro.log" "$RUNNER_TEMP/maestro-debug/metro.log" 2>/dev/null || true

      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-output
          path: ${{ runner.temp }}/maestro-debug
          retention-days: 14
          # An early failure (npm ci, Java setup) leaves neither path behind. Warn
          # rather than fail — the job has already failed for its own reason.
          if-no-files-found: warn
