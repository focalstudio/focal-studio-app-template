name: Maestro E2E

# Deliberately not on every push/PR: an iOS Simulator build needs macos-latest,
# billed at a 10x minute multiplier vs. ubuntu-latest, and `expo run:ios`'s
# full prebuild + native compile takes ~15-25 minutes per run. See #80.
on:
  # Invoked by release.yml as a reusable workflow, in the same run, right after it
  # creates the vX.Y.Z tag.
  #
  # Deliberately NOT `release: [published]`. release.yml publishes that Release using
  # the default GITHUB_TOKEN, and GitHub never fires workflows from events created by
  # that token (its recursion guard), so the release trigger was dead code — it
  # silently never ran. Same trap android-release.yml hit with `push: tags:`. See #95.
  workflow_call: {}
  # Manual rerun path (e.g. re-running the flow after a simulator-specific fix).
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Pinned, not "latest" — the installer has no checksum/signature step, so an
  # unpinned version lets a compromised or unexpectedly-changed
  # get.maestro.mobile.dev response silently alter what CI executes between
  # runs. Keep this in sync with the "Maestro CLI" row in VERSIONS.md.
  MAESTRO_VERSION: '2.8.0'

jobs:
  e2e:
    name: Maestro E2E (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check if app is bootstrapped
        id: bootstrap_check
        run: |
          if grep -q '\[APP_SLUG\]' app.json; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Template placeholders still present — skipping Maestro E2E run."
            echo "Run scripts/init.sh to bootstrap a real app before this workflow can run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Maestro CLI requires Java 17+; macos-latest doesn't guarantee one is
      # present, so pin it explicitly rather than relying on the runner image.
      - name: Setup Java
        if: steps.bootstrap_check.outputs.skip == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Maestro CLI (pinned)
        if: steps.bootstrap_check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          # -f so an HTTP error page is never piped into bash, and pipefail so a
          # failed download fails this step rather than surfacing later as a
          # confusing "maestro: command not found".
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          # $GITHUB_PATH only applies to later steps, so extend PATH here too.
          export PATH="$HOME/.maestro/bin:$PATH"
          # The installer reads MAESTRO_VERSION from the environment. Assert it
          # honoured it, so a silently-"latest" install can't pass as pinned.
          installed="$(maestro --version 2>&1 || true)"
          if [[ "$installed" != *"$MAESTRO_VERSION"* ]]; then
            echo "::error::Expected Maestro $MAESTRO_VERSION, got: $installed"
            exit 1
          fi

      - name: Resolve app identifiers
        if: steps.bootstrap_check.outputs.skip == 'false'
        id: app_ids
        run: |
          node -e "
            const app = require('./app.json').expo;
            console.log('app_id=' + app.ios.bundleIdentifier);
            console.log('app_scheme=' + app.scheme);
          " >> "$GITHUB_OUTPUT"

      # `expo run:ios` serves the JS bundle only for as long as it stays in the
      # foreground, and GitHub Actions sets CI=1 — under which it exits as soon
      # as the app is launched, taking Metro with it. A Debug build embeds no
      # bundle, so the app comes up on a red "No script URL provided" screen and
      # every assertion in the flow fails. Start Metro as its own background
      # process first so it outlives that step, and fail here rather than
      # halfway through the flow if it never becomes ready.
      - name: Start Metro bundler
        if: steps.bootstrap_check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          npx expo start --port 8081 > "$RUNNER_TEMP/metro.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8081/status 2>/dev/null | grep -q "packager-status:running"; then
              echo "Metro is ready."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Metro did not become ready within 120s"
          cat "$RUNNER_TEMP/metro.log" || true
          exit 1

      - name: Build and launch iOS app in Simulator
        if: steps.bootstrap_check.outputs.skip == 'false'
        run: npx expo run:ios

      # Runs the whole directory rather than naming one file, so a flow added
      # later is picked up without touching this workflow. Every flow starts by
      # clearing state, so they are order-independent; `APP_SCHEME` is consumed
      # only by full-journey.yaml and harmlessly unused by the others.
      - name: Run Maestro flows
        if: steps.bootstrap_check.outputs.skip == 'false'
        run: |
          maestro test .maestro/ \
            -e APP_ID="${{ steps.app_ids.outputs.app_id }}" \
            -e APP_SCHEME="${{ steps.app_ids.outputs.app_scheme }}"

      # Maestro's view hierarchies are the only practical way to diagnose a CI-only
      # failure — they are what identified four of the six flow defects fixed in #92.
      # Metro's log rides along in the same bundle because a cold-runner bundler
      # timeout is the other likely first-run failure mode. Copied out of $HOME
      # first: upload-artifact does not reliably expand `~` in `path:`.
      #
      # `maestro test` writes these to ~/.maestro/tests/<run> by default. Not using
      # `--debug-output`: that flag carries only maestro.log, while the screenshots
      # and hierarchies still land in the default directory.
      - name: Collect Maestro debug output
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/maestro-debug"
          cp -R "$HOME/.maestro/tests" "$RUNNER_TEMP/maestro-debug/tests" 2>/dev/null || true
          cp "$RUNNER_TEMP/metro.log" "$RUNNER_TEMP/maestro-debug/metro.log" 2>/dev/null || true

      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-output
          path: ${{ runner.temp }}/maestro-debug
          retention-days: 14
          # An early failure (npm ci, Java setup) leaves neither path behind. Warn
          # rather than fail — the job has already failed for its own reason.
          if-no-files-found: warn
