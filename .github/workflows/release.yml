name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  tag-and-release:
    name: Tag & GitHub Release
    runs-on: ubuntu-latest

    outputs:
      # 'true' only when this run actually created a new tag. Re-running the workflow
      # on an already-tagged main leaves this 'false', which keeps the Android job below
      # from rebuilding and re-submitting a release that already shipped.
      tag_created: ${{ steps.tag_exists.outputs.exists == 'false' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: tag_exists
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract changelog notes
        if: steps.tag_exists.outputs.exists == 'false'
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES=$(awk "/## \[$VERSION\]/{flag=1; next} /## \[/{flag=0} flag" CHANGELOG.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create tag
        if: steps.tag_exists.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: steps.tag_exists.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}

  # Build + submit the Android AAB as part of this same run.
  #
  # This is a direct reusable-workflow call rather than letting android-release.yml
  # listen for the tag push above: tags pushed with the default GITHUB_TOKEN never
  # trigger workflows, so the tag-driven version silently never ran. Calling it here
  # needs no PAT and no extra secret — nothing to create per app or rotate.
  android-release:
    name: Android Release
    needs: tag-and-release
    if: needs.tag-and-release.outputs.tag_created == 'true'
    uses: ./.github/workflows/android-release.yml
    secrets: inherit
