appId: ${APP_ID}
---
# End-to-end journey: launch → onboarding → dev-seed-session → paywall → tabs
# → settings → two-step account deletion → back to auth.
#
# `APP_ID` and `APP_SCHEME` are passed in via `maestro test -e` from the
# calling workflow (.github/workflows/maestro-e2e.yml), resolved at run time
# from app.json so this flow works whatever the bootstrapped app is named.
#
# Text assertions use fixed literal strings (not app.json's APP_NAME) because
# Maestro matches text as a substring/regex, so app-name-agnostic strings
# ("Welcome to", "Welcome", "Sign In") are stable without another env var.

- launchApp:
    clearState: true

# Onboarding — swipe through all three slides, then complete on the last one.
- assertVisible: "Welcome to"
- swipe:
    direction: LEFT
- assertVisible: "Your Key Feature"
- swipe:
    direction: LEFT
- assertVisible: "Start Today"
- tapOn: "Get Started"

# Auth wall — bypass with the dev-only seed-session seam (#79). Only present
# because BACKEND=none in an unbootstrapped/no-backend build; if a real
# backend is wired this button won't exist and the flow should fail loudly
# here rather than silently skip the rest of the journey.
- assertVisible: "Sign In"
- tapOn:
    id: "dev-seed-session"
- assertVisible:
    text: "Welcome"
    timeout: 10000

# Paywall — not linked from any in-app affordance in the template yet, so
# it's reached via its deep link rather than a tap path.
- openLink: "${APP_SCHEME}://paywall"
- assertVisible: "Start Free Trial"
- tapOn: "Close"

# Settings — two-step account deletion. Both native confirmation alerts must
# be walked; a single confirmation must not delete the account.
- tapOn: "Settings"
- assertVisible: "Settings"
- tapOn: "Delete Account"
- tapOn: "Continue"
- tapOn: "Delete Account"

# Back to auth — Stack.Protected in app/_layout.tsx redirects here on its own
# once isAuthenticated flips false; no manual navigation to assert against.
- assertVisible:
    text: "Sign In"
    timeout: 10000
