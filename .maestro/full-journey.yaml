appId: ${APP_ID}
---
# End-to-end journey: launch → onboarding → dev-seed-session → paywall → tabs
# → settings → two-step account deletion → back to auth.
#
# `APP_ID` and `APP_SCHEME` are passed in via `maestro test -e` from the
# calling workflow (.github/workflows/maestro-e2e.yml), resolved at run time
# from app.json so this flow works whatever the bootstrapped app is named.
#
# ── The contract ──────────────────────────────────────────────────────────────
# Every selector below is a `testID`, never screen copy. Copy is the first thing
# your app replaces; the ids are the seams it must keep. They are listed, with
# where each one lives, under "The seams the flows depend on" in docs/testing.md,
# and `src/__tests__/e2e-contract.test.ts` fails on every PR if a flow references
# an id that no longer exists in `app/` or `src/`.
#
# Redesign any screen you like. If you genuinely need to move a seam, change both
# sides — the guard test tells you when you have only changed one.
#
# ── The two exceptions, and why ───────────────────────────────────────────────
# Three text selectors survive, because no `testID` can reach them:
#   - "Continue" / "Delete Account" — buttons inside a native `Alert.alert`,
#     which has no React Native tree to attach a testID to. Their copy lives in
#     `handleDeleteAccount` in app/(tabs)/settings.tsx; reword it there and these
#     two lines must change with it.
#   - "Open" — iOS's own scheme-handoff dialog. Not app copy at all.
#
# Matching rule for those three, verified against Maestro 2.8.0 on an iOS
# Simulator: a text selector is a regex that must match the element's WHOLE
# accessibility label — it is not a substring match. All three are exact labels
# on a native button, so none of them needs a wildcard, and matching them loosely
# would risk hitting the view behind the alert instead of the button in it.
# Getting this wrong fails loudly on assertions, but a `tapOn` against an
# unmatched-but-present element can report COMPLETED while tapping nothing.

- launchApp:
    clearState: true

# Onboarding — swipe through all three slides, then complete on the last one.
# The slide count is app-specific: change the swipes if your app ships more or
# fewer than the template's three.
#
# The first assertion after launch gets a generous explicit wait rather than
# bare `assertVisible`: cold start has to mount the native runtime, load the JS
# bundle, and settle both store hydrations before anything renders. Maestro's
# default assertion timeout is far too short for that, so a bare assertVisible
# here fails against an app that is merely still booting.
- extendedWaitUntil:
    visible:
      id: "onboarding-slide-1"
    timeout: 60000
- swipe:
    direction: LEFT
- assertVisible:
    id: "onboarding-slide-2"
- swipe:
    direction: LEFT
- assertVisible:
    id: "onboarding-slide-3"
- tapOn:
    id: "onboarding-cta"

# Auth wall — bypass with the dev-only seed-session seam (#79). Only present
# because BACKEND=none in an unbootstrapped/no-backend build; if a real
# backend is wired this button won't exist and the flow should fail loudly
# here rather than silently skip the rest of the journey.
- assertVisible:
    id: "login-submit"
- tapOn:
    id: "dev-seed-session"
# The tab bar is the "we are signed in" marker, not anything on the home screen
# itself — a generated app rewrites that screen on day one. This assertion used
# to read `visible: "Welcome"`, the placeholder home card's title, in this file
# and in persistence.yaml. Both broke the first time a real app was built (#126).
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 10000

# Paywall — not linked from any in-app affordance in the template yet, so
# it's reached via its deep link rather than a tap path.
- openLink: "${APP_SCHEME}://paywall"
# iOS routes a scheme URL through the system opener, which puts up a native
# "Open in <App>?" confirmation before handing off. It is not part of the app,
# so it has to be dismissed explicitly — and it is conditional, because the
# prompt does not appear when the link is opened from within the app itself.
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "paywall-title"
    timeout: 15000
- tapOn:
    id: "paywall-close"

# Settings — two-step account deletion. Both native confirmation alerts must
# be walked; a single confirmation must not delete the account.
- tapOn:
    id: "tab-settings"
- assertVisible:
    id: "settings-title"
# DANGER ZONE sits below the fold, and an off-screen row is still in the
# accessibility tree — so a bare tapOn reports COMPLETED while landing on
# nothing. Scroll it into view first, or the two-step deletion below silently
# never starts.
- scrollUntilVisible:
    element:
      id: "settings-delete-account"
    direction: DOWN
- tapOn:
    id: "settings-delete-account"
# Native alert buttons — see "the two exceptions" in the header.
- tapOn: "Continue"
- tapOn: "Delete Account"

# Back to auth — Stack.Protected in app/_layout.tsx redirects here on its own
# once isAuthenticated flips false; no manual navigation to assert against.
- extendedWaitUntil:
    visible:
      id: "login-submit"
    timeout: 10000
