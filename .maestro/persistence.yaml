appId: ${APP_ID}
---
# Persistence across a force-quit: does what the app wrote survive being read
# back through the zod schemas in `src/types/schemas.ts`? (#52)
#
# Jest covers the schemas against fixtures. What it cannot cover is the real
# round trip — a value written by the running app, through AsyncStorage on a
# device, read back by `hydrate()` on a genuine cold start. That is what this
# flow is for, and it is why `stopApp` + a bare `launchApp` matter: `stopApp`
# force-quits without clearing data, and `clearState` defaults to false, so the
# second launch hydrates from the storage the first one left behind.
#
# Covers the two persisted shapes the template has UI to drive:
#   - the auth session → loadJson(SESSION_KEY, null, authSessionSchema)
#   - the theme        → themeSchema.catch("device").parse(...)
#
# Notification prefs and the subscription tier go through the same changed code
# path, but the template ships no affordance that writes either, so they stay
# covered by Jest (`src/__tests__/schemas.test.ts`) until one exists.
#
# `APP_ID` is passed in via `maestro test -e` from .github/workflows/maestro-e2e.yml.
#
# Every selector here is a `testID`, never screen copy — read the contract in
# full-journey.yaml's header, and the seam table in docs/testing.md, before
# editing one.

- launchApp:
    clearState: true

# Onboarding. This flow does not own onboarding coverage — full-journey.yaml
# does — but it does have to get through it, and the slide ids below are how it
# paces itself rather than what it is testing.
#
# The pacing is load-bearing. Consecutive swipes with nothing between them are
# the fragile construct: the second fires while the first is still animating,
# the pager settles on slide 2, and `onboarding-cta` there is labelled "Next"
# and merely advances it. Onboarding is then still on screen and this flow fails
# several steps later on `login-submit`, blaming the auth wall for a swipe that
# raced.
#
# The CTA wait before the first swipe, the 700ms duration, and the 180s timeout
# all match full-journey.yaml — see the reasoning there. Short version: a cold CI
# runner swallowed the first swipe outright, with the app sitting on slide 1, and
# 60s expired while the slide was already rendered (tick#14 measured a 54,161 ms
# cold first-bundle serve).
- extendedWaitUntil:
    visible:
      id: "onboarding-slide-1"
    timeout: 180000
- extendedWaitUntil:
    visible:
      id: "onboarding-cta"
    timeout: 15000
- swipe:
    direction: LEFT
    duration: 700
- extendedWaitUntil:
    visible:
      id: "onboarding-slide-2"
    timeout: 15000
- swipe:
    direction: LEFT
    duration: 700
# The precondition the tap below actually needs: we are on the LAST slide, so
# `onboarding-cta` completes onboarding instead of advancing the pager.
- extendedWaitUntil:
    visible:
      id: "onboarding-slide-3"
    timeout: 15000
- tapOn:
    id: "onboarding-cta"

# Auth wall — bypassed with the dev-only seed-session seam, which writes a real
# session blob through saveJson. Present only because BACKEND=none; if a
# backend is wired this button is absent and the flow fails loudly here.
- extendedWaitUntil:
    visible:
      id: "login-submit"
    timeout: 15000
- tapOn:
    id: "dev-seed-session"
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 10000

# Write an explicit theme. "device" is both the default and what
# `themeSchema.catch("device")` falls back to on any bad read — so "no longer
# device" is exactly the property a broken round trip cannot fake.
#
# Asserted on the description's id, never the switch's `checked` state. The
# Dark Mode switch is bound to the *resolved* appearance (`useTheme().isDark`),
# so which way it starts depends on the simulator's own light/dark setting, and
# a `checked:` assertion here would pass or fail on that. The description is
# driven by the stored value (`THEME_STATE` in app/(tabs)/settings.tsx) and says
# "following the device" only until the first touch — so this proves the value
# changed whichever way the switch happened to start.
#
# Every assertion here that follows a tap waits rather than asserting flat —
# same rule as full-journey.yaml. The tab navigator mounts Settings lazily, so
# the first switch to it renders a whole screen, and the description below only
# changes after the store write has re-rendered. `theme-following-device` is the
# exception and is deliberately bare: it shares a screen with the assertion
# above it, with no gesture in between.
- tapOn:
    id: "tab-settings"
- extendedWaitUntil:
    visible:
      id: "settings-title"
    timeout: 15000
- assertVisible:
    id: "theme-following-device"
- tapOn:
    id: "theme-dark-mode"
- extendedWaitUntil:
    visible:
      id: "theme-set-manually"
    timeout: 15000

# Force-quit, then cold-start against what the app just wrote.
- stopApp
- launchApp

# Landing anywhere other than the signed-in app means a persisted blob failed
# to read back: onboarding means the onboarding flag was lost, the auth wall
# means the session was. Both are exactly what the schemas are there to keep
# from happening silently.
#
# 180s for the same reason as the launch wait above: this is the second cold start
# in the flow, after a force-quit, so it pays the full bundle-serve cost again.
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 180000
# These stay flat, and must. `assertNotVisible` is the claim being made —
# waiting for something to be *absent* would pass the instant the screen has not
# rendered yet, which is precisely the failure it is here to catch. The wait
# above is what makes them safe: it holds until the app has actually rendered.
- assertNotVisible:
    id: "onboarding-slide-1"
- assertNotVisible:
    id: "login-submit"

# ...and the theme survived the round trip rather than falling back to "device".
# A failed read would put the description back to "following the device", which
# is the whole point of asserting on it in both directions.
- tapOn:
    id: "tab-settings"
- extendedWaitUntil:
    visible:
      id: "theme-set-manually"
    timeout: 15000
# Flat, for the reason given at the two assertNotVisible steps above.
- assertNotVisible:
    id: "theme-following-device"
